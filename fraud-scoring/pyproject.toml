[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-scoring"
version = "1.0.0"
description = "Real-time card fraud scoring: streaming point-in-time features, GBDT, cost-based decisioning"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pydantic==2.14.1",
    "scikit-learn==1.9.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    # FastAPI's TestClient (starlette) nags about httpx vs httpx2; harmless for in-process tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
