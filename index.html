        <div class="seg" role="tablist" aria-label="Chart series" data-seg></div>
      </div>
      <div class="chart" data-chart></div>
    </article>
    <article class="card card--alloc">
      <p class="card__label">Allocation <span class="dim">by lines of code</span></p>
      <div class="alloc" data-alloc></div>
      <ul class="legend" data-legend></ul>
      <p class="card__label mt">Coverage</p>
      <ul class="kv" data-kv></ul>

  </section>

      <ul class="activity" data-activity></ul>
    </article>
  </section>
</template>
