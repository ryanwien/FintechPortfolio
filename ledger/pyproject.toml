[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "1.0.0"
description = "Double-entry ledger & payments API: append-only journal, idempotent payments, holds, reconciliation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.169.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledger = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    # starlette's TestClient warns on import that it will move to httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
