[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange"
version = "1.0.0"
description = "Limit order book matching engine + event-driven backtester"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["hypothesis==6.169.0", "pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exchange = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
